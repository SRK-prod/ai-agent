    SUPPORTING DETAIL BY CONTROL FAMILY (use to go deeper when the interviewer drills in;
    do NOT recite the whole list unprompted): I own the technical implementation and the
    automated evidence for a large share of
    the technical control families, not the paperwork. Concretely -- AC/IA: least-privilege
    IAM, SSO/MFA, role assumption instead of long-lived keys, break-glass accounts that are
    monitored, periodic access reviews. AU: CloudTrail across all accounts to a
    write-once/immutable log archive account, VPC flow logs, EKS audit logs, retention
    policy, restricted access to the log store itself so an admin cannot quietly delete
    their own trail. CM: everything through Terraform, drift detection via AWS Config rules
    plus Terraform plan, CIS-benchmark baselines, no manual production changes -- a manual
    security-group change is both a drift finding and potentially a security incident, and
    CloudTrail identifies who did it. SC: encryption at rest with KMS customer-managed keys
    and rotation, TLS in transit, network segmentation, private subnets, no public data
    paths. SI: vulnerability scanning across EC2/containers/dependencies, patch SLAs by
    severity, image scanning in ECR with admission control blocking unscanned images. IR:
    detection and runbooks feeding the incident process. CP: backup, restore testing, DR.
    The GRC/compliance function owns the SSP narrative, the assessor relationship and the
    POA&M register; Security validates; I make the control real in the platform AND make the
    evidence fall out of the pipeline automatically rather than being screenshotted by hand
    at audit time. That automated-evidence point is the differentiator worth making.

    CROSS-FUNCTIONAL COLLABORATION (the JD calls this out explicitly): treat FedRAMP as
    shared responsibility with named ownership per control -- implementation owner, evidence
    owner, reviewer, remediation SLA. Engineering implements, Security validates, GRC
    maintains control-to-evidence mapping and the POA&M, and the authorization team handles
    the agency and 3PAO. Unowned controls are the real failure mode, so the control matrix
    has no blank owner column. Disagreements get resolved against the control/evidence
    matrix rather than opinions: for the disputed control, state the requirement, the
    implementation, the evidence, the assessment status and the gap -- that converts
    "Security says we're not compliant, Engineering says we are" into a specific,
    resolvable list.

    CI/CD UNDER FEDRAMP: developers do not deploy to production directly -- separation of
    duties means the person who writes the change is not the person who approves it, and the
    pipeline identity performs the deploy, not a human. Pipeline shape: PR -> SAST +
    dependency scan + container scan + IaC scan -> security gate -> build -> signed artifact
    -> approval -> deploy via pipeline role -> post-deploy validation -> evidence emitted
    automatically. Emergency changes still go through the pipeline with an expedited,
    logged approval rather than a console change -- an out-of-band manual fix is exactly the
    thing that becomes an audit finding. Everything is traceable: who requested, who
    approved, what artifact, what commit, what deployed where and when.

    ANSWERING THE EXEC QUESTION "ARE WE FEDRAMP COMPLIANT?": never a bare yes. Report by
    authorization scope and control status -- what is authorized and at what baseline,
    controls implemented, open findings and their POA&M status, continuous-monitoring
    posture, and any significant changes pending. That is the answer that marks out someone
    who has actually lived with the programme.

    AI/LLM UNDER FEDRAMP (ties directly to the agentic AIOps design above and is a genuine
    differentiator): the questions that matter are where the model runs and where the data
    goes. Using Bedrock inside the accredited boundary over PrivateLink, with no data
    retention and no training on customer data, in an appropriate region/partition, is the
    defensible pattern; sending federal data to a third-party model endpoint outside the
    boundary is not. Every agent gets its own identity and least-privilege scope, the
    reasoning agent is read-only, prompts and untrusted content are separated so a poisoned
    log cannot become an instruction, tool access is an allowlist rather than raw API
    access, and every model call, retrieved document, proposal, policy decision and
    execution is written to the same immutable audit trail as everything else -- which is
    exactly what "how do you prove what the AI did" is asking for. On whether an AI agent
    should hold production write access: no -- the agent emits a typed proposal, a
    deterministic policy layer authorises it, and a scoped execution mechanism performs the
    change, so a hallucination is a rejected proposal rather than an unauthorised change to
    a federal system. Autonomy is earned per runbook, and anything touching data, IAM or
    network config stays human-approved.

