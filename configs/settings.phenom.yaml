# Non-secret tunables. Secrets (API keys/tokens) live in .env only.

audio:
  sample_rate: 16000
  channels: 1
  block_ms: 30                 # capture callback block size
  input_device: "BlackHole"    # PRODUCTION setting: captures the meeting call's remote audio
                                # (the interviewer), routed here via your Multi-Output Device.
                                # Your own mic is never captured -- by design, so your own
                                # voice can't be mistaken for a question.
  noise_reduction: true

vad:
  backend: silero
  threshold: 0.5                # speech probability threshold
  min_speech_ms: 250
  min_silence_ms: 800           # silence gap that ends an utterance. 250ms cut mid-sentence
                                # on normal pauses; 700ms still fragmented real interview
                                # questions where the interviewer pauses to think mid-question.
                                # 1000ms reduces fragmentation AT THE SOURCE (fewer fragments
                                # to stitch back together downstream), at the cost of ~300ms
                                # extra latency before an answer starts. Worth it: a correctly
                                # captured whole question beats a fast partial one.

speaker:
  embedding_model: pyannote/embedding
  window_seconds: 5.0
  window_overlap_seconds: 1.0
  ignore_similarity_threshold: 0.75   # cosine similarity vs enrolled "me" embedding
  new_speaker_similarity_threshold: 0.70  # below this vs all known speakers => new cluster
  max_tracked_speakers: 6
  enrollment_db_path: data/speaker_enrollment.sqlite3

stt:
  backend: mlx-whisper   # Apple Silicon GPU via mlx-whisper -- measured (warm): 6s audio=0.33s,
                         # 30s audio=0.32s, vs 1.1s/5.5s on faster-whisper CPU. Switch back to
                         # faster-whisper on non-M-series machines.
  model_size: large-v3-turbo   # upgraded from "small" 2026-08-07 after a real interview call
                      # showed heavy hallucination (repeated-word loops) and mangled technical
                      # terms (OOMKilled -> "OOMCade", CrashLoopBackOff -> "crash look back
                      # off") on real-world noisy/cross-talk audio -- measured 3.1s/30s, still
                      # well under real-time
  device: auto                  # auto|cpu|cuda|mps (faster-whisper only supports cpu/cuda; mps falls back to cpu)
  compute_type: int8
  chunk_seconds: 2.5
  chunk_overlap_seconds: 0.5
  language: en

question_detector:
  backend: rule_based
  denylist_phrases:
    - "how are you"
    - "good morning"
    - "good afternoon"
    - "can you hear me"
    - "nice to meet you"
    - "thanks everyone"
    # Whisper's well-known hallucinations over silence/noise -- it emits these from its
    # training data (subtitle corpora) when the channel is effectively empty. Observed live.
    - "thank you"
    - "thanks for watching"
    - "thank you for watching"
    - "subscribe"
    - "see you next time"
    - "bye bye"
