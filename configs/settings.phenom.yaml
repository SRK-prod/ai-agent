    WHAT IT IS: FedRAMP is a US federal programme standardising security assessment and
    authorization for cloud services sold to government agencies. It is an AUTHORIZATION
    (an ATO -- Authority to Operate, issued by an agency's Authorizing Official), not a
    certification you buy. The control set IS NIST SP 800-53 -- FedRAMP selects a baseline
    from it and adds programme-specific parameters, templates and continuous-monitoring
    obligations. Baselines: Low / Moderate / High, chosen by FIPS 199 impact categorisation
    of confidentiality/integrity/availability; Moderate is the common case for SaaS handling
    CUI, High for law-enforcement/emergency-services/financial-sensitive data. Moving
    Moderate -> High mainly tightens boundary protection, encryption, availability/redundancy
    and audit requirements. Key control families to be able to name: AC (access control),
    AU (audit and accountability), CM (configuration management), IA (identification and
    authentication), IR (incident response), SC (system and communications protection),
    SI (system and information integrity), CA (assessment/authorization, includes CA-7
    continuous monitoring), CP (contingency planning), RA (risk assessment).

    THE TWO CLAIMS TO NEVER MAKE (both are instant credibility failures with anyone who
    actually knows FedRAMP): (1) "AWS is FedRAMP authorized so our application is compliant"
    -- FALSE. AWS's authorization covers AWS's services within their boundary; your system
    inherits some controls but still has to implement and evidence its own. (2) "We run in
    GovCloud so we're FedRAMP compliant" -- FALSE. GovCloud is an environment choice that
    helps with data residency and US-person access requirements; it does not authorize your
    service. Correct framing: AWS gives you INHERITED controls (physical/environmental,
    some infrastructure-level SC/CM), you own the customer-side controls, and the boundary
    diagram plus the SSP is where that split is documented.

    AUTHORIZATION BOUNDARY (asked constantly): everything that stores, processes or
    transmits federal data, plus everything that can affect its security -- your AWS
    accounts, VPCs, the AWS services in use, CI/CD tooling that can deploy into it, the
    logging/monitoring stack, secrets management, and any external SaaS in the data path.
    Adding a new AWS account, a new AWS service, or an external SaaS (Datadog, Splunk,
    PagerDuty) is a boundary question first and an engineering question second: is the
    service FedRAMP-authorized at the required baseline, does it receive federal data, does
    it change the SSP, and is it a "significant change" requiring notification and possibly
    re-assessment. The honest interview answer on any specific vendor's authorization status
    is "I'd verify the current FedRAMP Marketplace listing and the specific offering/region
    rather than assert it from memory" -- authorization status changes and is offering-
    specific, and guessing is how people get caught out.

    KEY ARTEFACTS AND ROLES: SSP (System Security Plan -- describes every control's
    implementation; the living document that must be updated when architecture changes).
    POA&M (Plan of Action and Milestones -- the tracked register of known gaps with owner,
    remediation plan, milestone dates and risk rating; findings that cannot be fixed
    immediately go here rather than being hidden). 3PAO (accredited independent assessor who
    tests controls and produces the SAR -- Security Assessment Report). Authorizing Official
    (the agency official who accepts the residual risk and issues the ATO). ConMon
    (continuous monitoring -- ongoing vulnerability scanning, monthly deliverables,
    significant-change reporting, annual assessment; CA-7 is the control, and ongoing
    authorization depends on it, so an ATO is not a one-time event).

    *** CANONICAL ANSWER SHAPE FOR "AS A DEVOPS ARCHITECT, WHAT ARE YOUR RESPONSIBILITIES
    FOR FEDRAMP?" *** (candidate-approved wording -- follow this shape closely; a generic
