# Non-secret tunables. Secrets (API keys/tokens) live in .env only.

audio:
  sample_rate: 16000
  channels: 1
  block_ms: 30                 # capture callback block size
  input_device: "CABLE Output (VB-Audio Virtual Cable)"  # WINDOWS: capture side of VB-Audio
                                # Virtual Cable -- carries the meeting call's remote audio (the
                                # interviewer), routed there by setting the meeting app's speaker
                                # output to "CABLE Input". Your own mic is never captured -- by
                                # design. If list_input_devices() shows a different exact string,
                                # match it here. (macOS used "BlackHole".)
  noise_reduction: true

vad:
  backend: silero
  threshold: 0.5                # speech probability threshold
  min_speech_ms: 250
  min_silence_ms: 800           # silence gap that ends an utterance. 250ms cut mid-sentence
                                # on normal pauses; 700ms still fragmented real interview
                                # questions where the interviewer pauses to think mid-question.
                                # 1000ms reduces fragmentation AT THE SOURCE (fewer fragments
                                # to stitch back together downstream), at the cost of ~300ms
                                # extra latency before an answer starts. Worth it: a correctly
                                # captured whole question beats a fast partial one.
  max_speech_ms: 28000          # force-close a segment after 28s of continuous speech even if
                                # the speaker hasn't paused. Silence is otherwise the ONLY thing
                                # that closes a segment, so an interviewer talking without a
                                # break produces one huge segment and nothing reaches STT until
                                # they finally stop.
                                # WHY 28000 AND NOT LOWER: Whisper decodes in fixed 30-SECOND
                                # WINDOWS, so cost is flat within a window and steps at the
                                # boundary. Measured here (model=base, idle CPU, 2026-09-01):
                                #   12s -> 2.98s | 24s -> 3.56s | 28s -> 4.54s   (1 window)
                                #   32s -> 7.66s | 45s -> 8.11s | 60s -> 8.51s   (2 windows)
                                # An earlier value of 12000 was set on a wrong assumption that
                                # cost was linear in length: it split a 24s question into two
                                # calls (~6s) where one call costs 3.56s -- nearly doubling the
                                # work. 28s keeps every utterance inside a single window while
                                # still capping a runaway monologue. Do not lower this to
                                # "get answers sooner"; it makes them later.
                                # The orchestrator's fragment-merge + answer-revision window
                                # stitch a mid-question cut back together. 0 disables.

speaker:
  enabled: false        # WINDOWS/VB-Cable: OFF. Diarization exists to drop the candidate's
                        # own voice before transcription, but this machine captures
                        # "CABLE Output" -- the meeting app's OUTPUT, i.e. the far end only --
                        # so your own mic is never in this stream and is_me can never fire.
                        # Turning it off skips loading pyannote+torch entirely (~1GB RSS) and
                        # saves ~0.3s of CPU per segment, which is real on a 2-core box that
                        # is also running the video call.
                        # Set back to true if the capture device could ever carry your voice:
                        # system-wide loopback, an aggregate/multi-input device, or a room mic.
  embedding_model: pyannote/embedding
  window_seconds: 5.0
  window_overlap_seconds: 1.0
  ignore_similarity_threshold: 0.75   # cosine similarity vs enrolled "me" embedding
  new_speaker_similarity_threshold: 0.70  # below this vs all known speakers => new cluster
  max_tracked_speakers: 6
  enrollment_db_path: data/speaker_enrollment.sqlite3

stt:
  backend: deepgram      # faster-whisper = local CPU | mlx-whisper = Apple GPU | deepgram = cloud
                         #
                         # MEASURED ON THIS MACHINE against the real recorded client call
                         # (2026-09-01), decode time per utterance:
                         #   length   base(local)   deepgram
                         #     2.5s      3.03s        0.56s
                         #      12s      2.98s        0.82s
                         #      28s      4.54s        0.81s
                         # and accuracy on the passage that broke the local models --
                         # "unattached volumes", "overprovisioned", "platforms/networking" --
                         # deepgram got all of them; base produced "out of time volumes" and
                         # "WIMA", tiny produced "Vista, Dr. Acer" for "wastage".
                         # Set back to faster-whisper to keep audio on-device (it still works,
                         # it is just ~5s slower per question and less accurate here).
                         #
                         # WHY LOCAL DOES NOT FIT: local STT is the entire
                         # latency budget here AND it fights the video call for the same two
                         # cores. Measured 2026-09-01 on the same ~2.2s utterance with "base":
                         #     CPU idle                                     3.85s
                         #     CPU at 99% (Chrome + Docker + the call)     33.2s
                         # No local model setting is both fast and accurate under that
                         # contention -- bigger fixes the mis-transcriptions and blows the
                         # latency budget, smaller does the reverse. Cloud transcription takes
                         # STT off the CPU entirely (~0.3-0.6s network round trip that does not
                         # degrade when the machine is busy) and is more accurate than "base".
                         # To switch: put DEEPGRAM_API_KEY in .env and set backend: deepgram.
                         # Trade-off: raw meeting audio then leaves the machine -- see the
                         # module docstring in stt/deepgram_engine.py. Keep faster-whisper if
                         # the audio must stay on-device.
  model_size: base      # WINDOWS/CPU: this box is a 2-core i5-7300U with no GPU, so STT is the
                      # entire latency budget. Chosen from measurement on a REAL recorded client
                      # call (scripts/transcribe_sample.py, 111s of speech, 2026-09-01) -- NOT
                      # from synthesized speech, which flattered the small models badly:
                      #   model  decode      "wondering if"  "platforms/     "wastage"
                      #                                       networking"
                      #   tiny   11s (0.10x)  "putting if" X  "CloudFlaw,  X  "Vista, Dr. Acer" XX
                      #                                        network 8"
                      #   base   18s (0.16x)  ok              ok              "missed"          X
                      #   small  68s (0.61x)  ok              ok              ok
                      #   large-v3-turbo ~45-50s per utterance -- queue backed up, answers 98s late
                      # base is the knee of the curve: near-tiny speed, but it recovers the
                      # structurally important words tiny destroys. tiny is NOT usable -- decoding
                      # "wastage" as "Vista, Dr. Acer" feeds the LLM noise it will answer from.
                      # For a typical 8s interview question that is ~1.3s of decode, which keeps
                      # end-to-end inside the ~4s target.
                      # If transcription accuracy matters more than speed on a given day, set
                      # "small" -- same quality as the reference column above, ~5s decode on an
                      # 8s question. (macOS ran large-v3-turbo on the Apple GPU, hence no issue.)
  device: cpu                   # auto|cpu|cuda|mps -- forced to cpu on this machine (Intel HD 620, no CUDA)
  compute_type: int8
  beam_size: 1        # greedy decoding. faster-whisper defaults to 5 (five hypotheses searched
                      # in parallel) which is cheap on a GPU and expensive on 2 CPU cores --
                      # measured 18.2s -> 14.0s on "small" here for no transcript difference.
  cpu_threads: 0      # 0 = CTranslate2 picks (all cores). Pin only if diarization starves it.
  chunk_seconds: 2.5
  chunk_overlap_seconds: 0.5
  language: en

question_detector:
  backend: rule_based
  denylist_phrases:
    - "how are you"
    - "good morning"
    - "good afternoon"
    - "can you hear me"
    - "nice to meet you"
    - "thanks everyone"
    # Whisper's well-known hallucinations over silence/noise -- it emits these from its
    # training data (subtitle corpora) when the channel is effectively empty. Observed live.
    - "thank you"
    - "thanks for watching"
    - "thank you for watching"
    - "subscribe"
    - "see you next time"
    - "bye bye"
