    CURRENT AI PROJECT -- PROBLEM THEN SOLUTION (real, built by this candidate, currently
    in pre-production review and going live shortly -- describe it as built and in review,
    NOT as long-running production):

    The problem: traditional telecom contact-center flows -- menu-tree IVR, forcing
    customers to navigate options and repeat information, then routing even simple,
    high-volume requests (activation, number porting, device checks) to a live agent --
    are expensive at scale and create customer friction. The business needed those routine
    requests resolved conversationally, across voice/chat/SMS/WhatsApp/email, in English
    and Spanish, without inflating live-agent headcount, while never getting customer
    identity or fulfillment wrong, because that touches billing and portability directly.

    The solution (de-identified -- never name the real brand/project; say "the brand" or
    "my current organization's brand" if a label is needed): a multi-agent conversational AI
    system on the same reach-platform estate, built on Amazon Q in Connect with Anthropic
    Claude via Amazon Bedrock. Two AI agents in sequence -- a credential-gathering agent on Claude
    Sonnet 4 -- model id us.anthropic.claude-sonnet-4-6, state it as "Sonnet 4", NEVER as
    Sonnet 5, since naming your own system's model wrongly is an instant credibility hit --
    (higher reasoning, because misidentifying a customer is expensive), handing off via
    session attributes to a service-orchestration agent on Claude Haiku 4.5 (faster and
    cheaper for high-volume fulfilment). That deliberate model tiering is a core design
    decision, directly driven by the problem: pay for reasoning only where getting it wrong
    is expensive. The orchestration agent does tool/function calling across 15+
    Lambda-backed tools: SIM/eSIM activation, number portability (port-in, status, update),
    IMEI/device compatibility checks, OTP generation and verification, eSIM QR resend, ZIP
    validation, fee lookup, and JIRA ticket creation on activation failure. A knowledge base
    with semantic retrieval (Retrieve tool) grounds FAQ answers. Structured outcomes --
    Complete / Escalate / Terminate / Callback -- drive human-in-the-loop escalation to ~40
    live agents, which is the guardrail: the agent resolves or hands off, it never guesses.
    Memory via session attributes plus Customer Profiles storing previous-interaction
    summaries. Bilingual English/Spanish with separate orchestration prompts. Multi-channel:
    voice, chat, SMS, WhatsApp, email. Observability through Contact Lens (sentiment,
    post-contact summary, real-time analytics) and flow logging. Security: KMS-encrypted
    call recordings and chat transcripts in S3, SAML SSO.

    PLATFORM FOUNDATION (real) -- what makes the AI system production-ready, enterprise-
    safe and cost-accountable: govern ~160 cloud accounts -- 80 AWS and 80 GCP -- structured
    4 accounts per customer (dev / QA / staging / production) for blast-radius and cost
    isolation. 80+ serverless microservices on Lambda, API Gateway, Step Functions, SQS,
    SNS, DynamoDB, Aurora, RDS, S3, Route53, CloudFront, WAF. Own the multi-account landing
